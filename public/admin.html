<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - OpenClaw 實例監控</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .container { max-width: 1320px; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 28px; }
    .header .logo { margin-bottom: 0; }
    .admin-badge { background: rgba(239, 68, 68, 0.15); color: #fca5a5; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; border: 1px solid rgba(239,68,68,0.3); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .toolbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .auto-refresh-note { color: var(--text-muted); font-size: 0.82rem; }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .summary-card { padding: 16px 18px; border: 1px solid var(--border-card); border-radius: var(--radius-sm); background: rgba(0,0,0,0.18); }
    .summary-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .summary-value { font-size: 1.8rem; font-weight: 700; color: #fff; }
    .summary-sub { font-size: 0.82rem; color: var(--text-secondary); margin-top: 6px; }

    .alerts-panel { border: 1px solid rgba(245, 158, 11, 0.18); border-radius: var(--radius-sm); background: rgba(15, 23, 42, 0.5); padding: 16px; margin-bottom: 18px; }
    .alerts-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .alerts-title { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .alerts-empty { color: var(--text-muted); font-size: 0.88rem; }
    .alerts-list { display: grid; gap: 8px; }
    .alert-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; border: 1px solid rgba(148, 163, 184, 0.14); border-radius: 12px; padding: 10px 12px; background: rgba(2, 6, 23, 0.35); }
    .alert-item .alert-title { color: #fff; font-size: 0.88rem; font-weight: 600; }
    .alert-item .alert-detail { color: var(--text-secondary); font-size: 0.8rem; margin-top: 2px; }

    .filters { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(4, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .filters input, .filters select {
      width: 100%; padding: 11px 12px; font-size: 0.9rem; background: var(--bg-input);
      border: 1px solid var(--border-input); border-radius: var(--radius-xs); color: var(--text-primary);
    }
    .filters input:focus, .filters select:focus { outline: none; border-color: var(--border-focus); }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
    th { text-align: left; padding: 12px 14px; color: var(--text-secondary); font-weight: 500; font-size: 0.85rem; border-bottom: 1px solid var(--border-card); white-space: nowrap; }
    td { padding: 16px 14px; background: rgba(0,0,0,0.15); border-top: 1px solid rgba(100,120,200,0.05); border-bottom: 1px solid rgba(100,120,200,0.05); vertical-align: top; }
    tr td:first-child { border-left: 1px solid rgba(100,120,200,0.05); border-top-left-radius: var(--radius-sm); border-bottom-left-radius: var(--radius-sm); }
    tr td:last-child { border-right: 1px solid rgba(100,120,200,0.05); border-top-right-radius: var(--radius-sm); border-bottom-right-radius: var(--radius-sm); }
    tr:hover td { background: rgba(0,0,0,0.25); }

    .meta-text { font-size: 0.76rem; color: var(--text-muted); display: block; margin-top: 4px; }
    .mono { font-family: 'Courier New', monospace; }
    .status-text { font-size: 0.88rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
    .action-group { display: flex; gap: 8px; flex-wrap: wrap; }

    .health-stack, .signal-stack { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 10px; font-size: 0.76rem; font-weight: 600; border: 1px solid transparent; }
    .badge-healthy { background: rgba(16,185,129,0.15); color: #6ee7b7; border-color: rgba(16,185,129,0.25); }
    .badge-warning { background: rgba(245,158,11,0.15); color: #fcd34d; border-color: rgba(245,158,11,0.25); }
    .badge-critical { background: rgba(239,68,68,0.14); color: #fca5a5; border-color: rgba(239,68,68,0.25); }
    .badge-pending { background: rgba(96,165,250,0.14); color: #93c5fd; border-color: rgba(96,165,250,0.24); }
    .badge-info { background: rgba(59,130,246,0.14); color: #bfdbfe; border-color: rgba(96,165,250,0.24); }
    .badge-idle, .badge-unknown { background: rgba(120,130,160,0.16); color: #cbd5e1; border-color: rgba(148,163,184,0.22); }

    .progress-wrap { min-width: 140px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; gap: 8px; }
    .progress-bar { height: 8px; border-radius: 999px; background: rgba(148,163,184,0.16); overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #60a5fa 0%, #818cf8 100%); border-radius: 999px; }
    .progress-fill.warn { background: linear-gradient(90deg, #f59e0b 0%, #f97316 100%); }
    .progress-fill.critical { background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-content { background: var(--bg-card); border: 1px solid var(--border-card); padding: 32px; border-radius: var(--radius); width: 100%; max-width: 400px; box-shadow: var(--shadow-card); }
    .modal h3 { margin-bottom: 20px; font-size: 1.2rem; }

    @media (max-width: 900px) {
      .filters { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 760px) {
      .container { padding: 16px 12px 28px; }
      .header { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
      .toolbar { align-items: stretch; }
      .toolbar-actions { width: 100%; justify-content: space-between; }
      .filters { grid-template-columns: 1fr; }
      .table-responsive { overflow: visible; }
      table, thead, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      table { border-spacing: 0; }
      tr { display: block; margin-bottom: 14px; }
      td {
        border-left: 1px solid rgba(100,120,200,0.05);
        border-right: 1px solid rgba(100,120,200,0.05);
        border-radius: 0 !important;
        padding: 12px 14px;
      }
      tr td:first-child { border-top-left-radius: var(--radius-sm) !important; border-top-right-radius: var(--radius-sm) !important; }
      tr td:last-child { border-bottom-left-radius: var(--radius-sm) !important; border-bottom-right-radius: var(--radius-sm) !important; }
      td::before {
        content: attr(data-label);
        display: block;
        color: var(--text-muted);
        font-size: 0.72rem;
        margin-bottom: 6px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .action-group { flex-direction: column; }
      .btn-sm { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🦞</span>
        <span class="logo-text">OpenClaw</span>
      </div>
      <span class="admin-badge">Admin Monitoring</span>
    </header>

    <section class="card">
      <div class="toolbar">
        <div>
          <h2 class="card-title" style="margin:0;"><span class="title-icon">📡</span>Docker OpenClaw 實例監控</h2>
          <div class="auto-refresh-note">每 10 秒自動刷新一次，列表頁顯示聚合監控快照。</div>
        </div>
        <div class="toolbar-actions">
          <span class="auto-refresh-note" id="generated-at">尚未更新</span>
          <button class="btn-sm btn-secondary" data-refresh-btn>↻ 立即刷新</button>
        </div>
      </div>

      <div id="summary-grid" class="summary-grid"></div>

      <div class="alerts-panel">
        <div class="alerts-header">
          <div class="alerts-title">🚨 目前告警</div>
          <div class="auto-refresh-note" id="alerts-meta">僅顯示最重要的 12 條</div>
        </div>
        <div id="alerts-list" class="alerts-list"></div>
      </div>

      <div class="filters">
        <input id="search-input" type="text" placeholder="搜尋 user / bot / agent / container">
        <select id="filter-lifecycle">
          <option value="">全部生命週期</option>
          <option value="pending_scan">等待掃碼</option>
          <option value="pending_activation">等待激活</option>
          <option value="running">運行中</option>
          <option value="stopped">已停止</option>
          <option value="error">錯誤</option>
          <option value="provisioned">已部署</option>
        </select>
        <select id="filter-health">
          <option value="">全部健康度</option>
          <option value="critical">Critical</option>
          <option value="warning">Warning</option>
          <option value="pending">Pending</option>
          <option value="healthy">Healthy</option>
          <option value="idle">Idle</option>
        </select>
        <select id="filter-auth">
          <option value="">全部授權</option>
          <option value="codex-cli">Codex CLI</option>
          <option value="openai-api-key">API Key</option>
          <option value="not-ready">Auth 未就緒</option>
        </select>
        <select id="sort-by">
          <option value="severity">依嚴重度</option>
          <option value="activity">依最近活動</option>
          <option value="spend">依花費使用率</option>
          <option value="cpu">依 CPU</option>
          <option value="sessions">依 24h Sessions</option>
        </select>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>實例</th>
              <th>生命週期 / Runtime</th>
              <th>健康訊號</th>
              <th>授權 / 成本</th>
              <th>活動</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="instances-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="login-modal" class="modal">
    <div class="modal-content">
      <h3>管理員登入</h3>
      <input type="password" id="admin-password" class="key-input" style="width: 100%; margin-bottom: 16px; padding: 12px;" placeholder="請輸入管理員密碼">
      <button class="btn-sm btn-primary" style="width: 100%; padding: 12px; justify-content: center;" onclick="submitAdminLogin(document.getElementById('admin-password').value)">登入</button>
      <div id="login-error" style="color: var(--error); margin-top: 10px; font-size: 0.85rem; display: none;"></div>
    </div>
  </div>

  <script src="/api.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/admin/instances.js"></script>
</body>
</html>
