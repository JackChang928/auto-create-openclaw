[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

# Extract agent_id from the Docker container name (e.g. auto-openclaw-user-xxx)
[FILTER]
    Name         modify
    Match        *
    Copy         container_name agent_id

# Optional: Only keep logs that look like a tool call to save processing power
[FILTER]
    Name         grep
    Match        *
    Regex        log .*Tool Use.*|.*Calling tool.*|.*Action:.*

# Extract the tool name from the log message using Regex
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       openclaw_tool_parser
    Reserve_Data True

