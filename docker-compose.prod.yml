version: '3.8'

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - DATABASE_URL=postgresql://litellm:litellm_pass@postgres:5432/litellm
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic ${LANGFUSE_OTEL_AUTH}
    command: [ "--config", "/app/config.yaml", "--detailed_debug" ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openclaw_net
      - db_net
      - redis_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:15-alpine
    container_name: litellm-postgres
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm_pass
      - POSTGRES_DB=litellm
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    restart: unless-stopped
    networks:
      - redis_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:3.0.7
    container_name: fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    networks:
      - redis_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  billing-service:
    image: ${BILLING_SERVICE_IMAGE:-openclaw-billing:latest}
    container_name: openclaw-billing
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://litellm:litellm_pass@postgres:5432/litellm
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - db_net
      - redis_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-openclaw-auth:latest}
    container_name: openclaw-auth
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    networks:
      - openclaw_net
      - redis_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://litellm:litellm_pass@postgres:5432/litellm
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://localhost:3002}
      - SALT=${LANGFUSE_SALT}
      - TZ=Asia/Shanghai
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - HOST=0.0.0.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openclaw_net
      - db_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  openclaw_net:
    name: openclaw_shared_net
    driver: bridge
  db_net:
    name: openclaw_db_net
    driver: bridge
  redis_net:
    name: openclaw_redis_net
    driver: bridge

volumes:
  litellm_pgdata:
