# docker-compose.hermes.yml — Hermes Agent 部署配置（支援飛書）
# 使用方式：
#   docker compose -f docker-compose.hermes.yml up -d
#   或與現有 stack 合併：
#   docker compose -f docker-compose.yml -f docker-compose.hermes.yml up -d

services:
  hermes-agent:
    image: ghcr.io/jackchang928/auto-create-openclaw-hermes:latest
    container_name: hermes-agent
    restart: unless-stopped
    ports:
      - "${HERMES_PORT:-18790}:18790"
      - "${HERMES_WS_PORT:-18791}:18791"
    environment:
      # ── AI API Keys ───────────────────────────────────────────────
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}

      # ── 飛書/Lark（Hermes 原生內建，無需額外插件）──────────────
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_ENABLED=${FEISHU_ENABLED:-true}
      - FEISHU_PAIRING_MODE=${FEISHU_PAIRING_MODE:-QR_SCAN}
      - FEISHU_GROUP_RESPONSE_MODE=${FEISHU_GROUP_RESPONSE_MODE:-AT}

      # ── Telegram Bot ──────────────────────────────────────────────
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}

      # ── Discord Bot ──────────────────────────────────────────────
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_ENABLED=${DISCORD_ENABLED:-false}

      # ── Slack Bot ────────────────────────────────────────────────
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_ENABLED=${SLACK_ENABLED:-false}

      # ── 系統配置 ─────────────────────────────────────────────────
      - TZ=${TZ:-Asia/Taipei}
      - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-INFO}
      - HERMES_GATEWAY_PORT=${HERMES_GATEWAY_PORT:-18790}
      - HERMES_WS_PORT=${HERMES_WS_PORT:-18791}

      # ── 資源配置 ─────────────────────────────────────────────────
      - HERMES_MEMORY_LIMIT=${HERMES_MEMORY_LIMIT:-4g}
      - HERMES_CPU_LIMIT=${HERMES_CPU_LIMIT:-2}
      - HERMES_ENABLE_BROWSER=${HERMES_ENABLE_BROWSER:-false}
    volumes:
      # 數據持久化目錄（sessions, memories, skills, logs）
      - hermes_data:/opt/data
      # 可選：自訂 SOUL.md
      # - ${HERMES_SOUL_PATH:-./hermes_soul.md}:/opt/data/SOUL.md:ro
    shm_size: ${HERMES_SHM_SIZE:-256m}
    deploy:
      resources:
        limits:
          cpus: ${HERMES_CPU_LIMIT:-2}
          memory: ${HERMES_MEMORY_LIMIT:-4G}
        reservations:
          cpus: 0.5
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18790/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hermes_net

volumes:
  hermes_data:
    driver: local

networks:
  hermes_net:
    name: hermes_shared_net
    driver: bridge
